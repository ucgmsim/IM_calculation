name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ci:
    uses: ucgmsim/meta-ci-action/.github/workflows/ci.yml@v2
    with:
      # `dev`, `test` and `types` are optional-dependency extras rather than a
      # [dependency-groups] table, so --all-extras is what pulls them in;
      # --dev would be a no-op here.
      uv-extra-args: "--all-extras"
      enable-coverage: true
      cov-package: IM
      cov-fail-under: 95
