---
extends: existence
message: "Figurative 'carry': '%s'. Name what the thing contains, stores, records, sets or applies."
level: error
ignorecase: true
nonword: true
# `ai-tells.FigurativeCarries` gates on a head-noun list or on a
# determiner-fronted subject, and by its own account leaves the bare plural
# subject out because arithmetic prose puts the carry noun in that slot. Four
# uses in this repo went straight through it:
#
#   Accelerations carry the 'g0' unit        bare plural subject, no determiner
#   ... a real DataArray carries             subject and verb split by a newline
#   ... holds column indices and carries     coordinated verb, no subject
#   ... the benchmark doesn't carry          bare infinitive after an auxiliary
#
# This repo has no freight, logistics or biology prose, so it does not need
# that rule's discrimination: here the word is a smell in every part of speech
# it has. The tokens below take the verb in all four inflections (finite,
# infinitive, participle and gerund), the agent noun, and the compound noun.
#
# The one sense left alone is the other word spelt the same way: the carry of
# an adder and the carrier of a modulated signal, both of which name a
# specific object rather than standing in for "contains". Neither appears in
# the Python today, but the crate under src-rust/ is numerics and the FFT code
# is signal processing, so the exemption is cheap insurance against a docstring
# that has to say "carry bit".
tokens:
  # Verb in every inflection, and with it the gerund ("the carrying of state")
  # and the participial adjective ("the carrying dimension").
  - '\bcarr(?:y|ies|ied|ying)\b(?![-\s](?:bit|flag|chain|in|out|save|select|propagation|look-?ahead)\b)'
  # Noun: the compound, which the token above cannot reach because the `\b`
  # after "carry" fails against the following letter.
  - '\bcarry[-\s]?overs?\b'
  # Agent noun.
  - '\bcarriers?\b(?![-\s](?:signal|wave|frequency|frequencies|phase|band)\b)'
